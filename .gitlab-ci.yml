---
variables:
  FF_SCRIPT_SECTIONS: "true"
  GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PIPELINE_ID}/${CI_PROJECT_NAME}"
  WAIT_FOR_SERVICES_TIMEOUT: "120"

include:
  - component: gitlab.library.upenn.edu/devops/gitlab/components/sast/secret_scan@2.5.0
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_context: "rails_app/"
      docker_build_secrets: "--secret id=sidekiq_pro_credentials,env=SIDEKIQ_PRO_CREDENTIALS"
      docker_target: "base"
      job_suffix: "_base"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      needs_build:
        - secret_detection
      platforms: '["linux/amd64"]'
      stage: "build_base"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      docker_build_args: "--build-arg RAILS_ENV=development"
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_context: "rails_app/"
      docker_build_secrets: "--secret id=sidekiq_pro_credentials,env=SIDEKIQ_PRO_CREDENTIALS"
      docker_target: "development"
      job_suffix: "_development"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      platforms: '["linux/amd64"]'
      stage: "build_development"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      amend_tag_with_docker_target: "false"
      docker_build_args: "--build-arg RAILS_ENV=production"
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_context: "rails_app/"
      docker_build_secrets: "--secret id=sidekiq_pro_credentials,env=SIDEKIQ_PRO_CREDENTIALS"
      docker_target: "production"
      job_suffix: "_production"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      platforms: '["linux/amd64"]'
      stage: "build_production"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/general/install_ansible@~latest
  - component: gitlab.library.upenn.edu/devops/gitlab/components/general/ci_requirements@~latest
  - component: gitlab.library.upenn.edu/devops/gitlab/components/tests/rubocop@~latest
    inputs:
      app_dir: "rails_app"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/sast/trivy@2.5.0
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_tag_to_scan: "${CI_COMMIT_SHA}"
      needs:
        - "amend_manifest_production"
      stage: "test"
  - component: gitlab.library.upenn.edu/devops/gitlab/components/docker/stage_finalize@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      needs_copy:
        - reek_app_test
        - rspec_app_integration_test
        - rspec_app_unit_test
        - rubocop
        - trivy_scan
  - component: gitlab.library.upenn.edu/devops/gitlab/components/deploy/deploy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      deploy_environment: "staging"
      deploy_environment_url: "https://find-staging.library.upenn.edu"
      deploy_host: ${DEPLOY_HOST}
      image_tag: "${CI_COMMIT_SHORT_SHA}-development"
      job_suffix: "staging"
      valid_principals: ${VALID_PRINCIPALS}
      vault_auth_role: ${JWT_ROLE}
      vault_ssh_client_role: ${VAULT_SSH_CLIENT_ROLE}
  - component: gitlab.library.upenn.edu/devops/gitlab/components/deploy/deploy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      deploy_environment: "production"
      deploy_environment_url: "https://find.library.upenn.edu"
      deploy_host: ${DEPLOY_HOST}
      image_tag: ${CI_COMMIT_TAG}
      job_suffix: "production"
      valid_principals: ${VALID_PRINCIPALS}
      vault_auth_role: ${JWT_ROLE}
      vault_ssh_client_role: ${VAULT_SSH_CLIENT_ROLE}

stages:
  - secret_check
  - build_base
  - build_development
  - build_production
  - test
  - finalize
  - deploy

.rspec_app_test:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/${CI_PIPELINE_ID}:${CI_COMMIT_SHORT_SHA}-development
  needs:
    - amend_manifest_development
  services:
    - name: postgres:16.12
      variables:
        POSTGRES_DB: "find_test"
        POSTGRES_PASSWORD: "rspec_test"
        POSTGRES_USER: "rspec_test"
    - name: bitnamilegacy/solr:9.6.1
      alias: solr
      variables:
        HEALTHCHECK_TCP_PORT: "8983"
        SOLR_CLOUD_BOOTSTRAP: "yes"
        SOLR_ENABLE_AUTHENTICATION: "yes"
        SOLR_HOST: "solr"
        SOLR_JAVA_MEM: "-Xms4g -Xmx4g"
        SOLR_MODE: "solrcloud"
        SOLR_OPTS: "-Dsolr.disableConfigSetsCreateAuthChecks=true -Dsolr.modules=analysis-extras"
        ZK_CREATE_CHROOT: "true"
  variables:
    ANSIBLE_COLLECTIONS_CACHE_DIR: .cache/ansible/collections
    APP_URL: "find.test.com"
    DATABASE_HOST: "postgres"
    DATABASE_NAME: "find_test"
    DATABASE_PASSWORD: "rspec_test"
    DATABASE_USER: "rspec_test"
    FF_NETWORK_PER_BUILD: "true"
    GALAXY_REQUIREMENTS_FILE: ".gitlab/ci-requirements.yml"
    RAILS_ENV: "test"
    RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: "1"
    SOLR_COLLECTION_NAME: "find-test"
    SOLR_CONFIGSET_NAME: "find"
    SOLR_TEST_URL: "http://solr:8983/solr/find-test"
    SOLR_URL: "http://solr:8983"
  cache:
    - key:
        files:
          - .gitlab/ci-requirements.yml
        prefix: ansible-collections
      paths:
        - $ANSIBLE_COLLECTIONS_CACHE_DIR
  before_script:
    - !reference [.install_ansible, before_script]
    - !reference [.ci_requirements, before_script]
    - mkdir -p /tmp/indexing && cd /tmp/indexing
    - git clone -n --depth=1 --filter=tree:0 https://gitlab.library.upenn.edu/dld/catalog/catalog-indexing.git .
    - git sparse-checkout set --no-cone rails_app/solr/conf
    - git checkout
    - rm -fr ${CI_PROJECT_DIR}/rails_app/solr/*
    - mv /tmp/indexing/rails_app/solr/conf ${CI_PROJECT_DIR}/rails_app/solr
    - sed -i '/<lib /d' ${CI_PROJECT_DIR}/rails_app/solr/conf/solrconfig.xml
    - cd ${CI_PROJECT_DIR}
  script:
    - >-
      ansible-playbook library.ci.rails_test
      -e rails_test_app_dir="rails_app"
      -e rails_test_solr_url="http://solr:8983"
      -e rails_test_solr_username="admin"
      -e rails_test_solr_password="Bitnami"
  after_script:
    - cat rails_app/rspec.log 2>/dev/null || true
  coverage: '/\(\d+.\d+\%\) covered/'
  artifacts:
    paths:
      - rails_app/tmp/coverage/index.html
      - rails_app/tmp/capybara
      - rails_app/rspec.xml
    expire_in: 1 week
    reports:
      junit: rails_app/rspec.xml
  rules:
    - exists:
        - rails_app/spec/**.rb
        - rails_app/spec/**/**.rb
  tags:
    - build

rspec_app_unit_test:
  extends:
    - .rspec_app_test
  variables:
    SPEC_OPTS: "--tag ~type:system"

rspec_app_integration_test:
  extends:
    - .rspec_app_test
  services:
    - name: ghcr.io/browserless/chromium:v2.38.4
      alias: chrome
      variables:
        PORT: 3333
        CONCURRENT: 1
        TIMEOUT: 1200000
    - name: postgres:16.12
      variables:
        POSTGRES_DB: "find_test"
        POSTGRES_PASSWORD: "rspec_test"
        POSTGRES_USER: "rspec_test"
    - name: bitnamilegacy/solr:9.6.1
      alias: solr
      variables:
        HEALTHCHECK_TCP_PORT: "8983"
        SOLR_CLOUD_BOOTSTRAP: "yes"
        SOLR_ENABLE_AUTHENTICATION: "yes"
        SOLR_HOST: "solr"
        SOLR_JAVA_MEM: "-Xms4g -Xmx4g"
        SOLR_MODE: "solrcloud"
        SOLR_OPTS: "-Dsolr.disableConfigSetsCreateAuthChecks=true -Dsolr.modules=analysis-extras"
        ZK_CREATE_CHROOT: "true"
  variables:
    CHROME_URL: "ws://chrome:3333"
    SPEC_OPTS: "--tag type:system"
  allow_failure: true

reek_app_test:
  stage: test
  image: ${CI_REGISTRY_IMAGE}/${CI_PIPELINE_ID}:${CI_COMMIT_SHORT_SHA}-development
  needs:
    - amend_manifest_development
  script:
    - cd rails_app && bundle exec reek app
  rules:
    - exists:
        - rails_app/.reek.yml
  tags:
    - build

deploy_staging:
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"

deploy_production:
  needs:
    - copy_docker_images
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.[a-zA-Z0-9]+)?$/
